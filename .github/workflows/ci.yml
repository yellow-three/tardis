name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  lint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: [8.3, 8.4, 8.5]
    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: json, mbstring, openssl, sqlite, pdo, pdo_sqlite
          tools: composer

      - name: Get Composer Cache Directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer Dependencies
        uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('composer.json') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Run linting
        run: composer lint

  static-analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.4
          extensions: json, mbstring, openssl, sqlite, pdo, pdo_sqlite, gd
          tools: composer

      - name: Get Composer Cache Directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer Dependencies
        uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('composer.json') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Run PHPStan
        run: composer analyse -- --no-progress --error-format=github

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: [8.3, 8.4, 8.5]
    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: json, mbstring, openssl, sqlite, pdo, pdo_sqlite, gd
          tools: composer
          coverage: pcov

      - name: Get Composer Cache Directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer Dependencies
        uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('composer.json') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Run tests with coverage
        run: vendor/bin/pest --coverage-clover coverage.xml --min=80

      - name: Upload coverage to Codecov
        if: matrix.php == '8.4'
        uses: codecov/codecov-action@v7
        with:
          files: coverage.xml
          flags: unittests
          name: codecov-umbrella
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  build-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build assets
        run: npm run build

      - name: Check the committed bundle is up to date
        run: |
          if ! git diff --exit-code -- resources/compiled; then
            echo "resources/compiled is stale - run npm run build and commit it"
            exit 1
          fi

  test-databases:
    name: test (${{ matrix.db }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        db: [mysql, pgsql]
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: tardis_test
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -ppassword"
          --health-interval=10s --health-timeout=5s --health-retries=5
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: password
          POSTGRES_DB: tardis_test
        ports: ['5432:5432']
        options: >-
          --health-cmd=pg_isready
          --health-interval=10s --health-timeout=5s --health-retries=5
    env:
      TARDIS_TEST_DB: ${{ matrix.db }}
      DB_HOST: 127.0.0.1
      DB_PORT: ${{ matrix.db == 'pgsql' && '5432' || '3306' }}
      DB_DATABASE: tardis_test
      DB_USERNAME: ${{ matrix.db == 'pgsql' && 'postgres' || 'root' }}
      DB_PASSWORD: password
    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.4
          extensions: json, mbstring, openssl, pdo, pdo_mysql, pdo_pgsql, gd
          tools: composer

      - name: Get Composer Cache Directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer Dependencies
        uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('composer.json') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Run tests
        run: vendor/bin/pest

  test-lowest:
    name: test (lowest dependencies)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.3
          extensions: json, mbstring, openssl, sqlite, pdo, pdo_sqlite, gd
          tools: composer

      # The lowest version of every dependency composer.json allows: proves
      # the declared minimums (laravel/framework ^13.0, livewire ^4.0, ...)
      # are really enough.
      - name: Install lowest dependencies
        run: composer update --prefer-lowest --prefer-stable --no-interaction --no-progress --prefer-dist

      - name: Run tests
        run: vendor/bin/pest

  test-next:
    name: test (upcoming Laravel and Livewire)
    runs-on: ubuntu-latest
    # The unreleased branches of Laravel 13 and Livewire 4 move every day; a
    # failure here is an early warning of the next release,
    # not a reason to block a merge.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.5
          extensions: json, mbstring, openssl, sqlite, pdo, pdo_sqlite, gd
          tools: composer

      - name: Install development versions
        run: |
          composer config minimum-stability dev
          composer config prefer-stable true
          composer require laravel/framework:"13.x-dev as 13.99" livewire/livewire:"dev-main as 4.99" --no-update --no-interaction
          composer update --no-interaction --no-progress --prefer-dist

      - name: Run tests
        run: vendor/bin/pest

  test-next-major:
    name: test (Laravel master, next major)
    runs-on: ubuntu-latest
    # Laravel's master branch is where the next major (14) is built, and
    # Testbench 12 follows it. Today master is still aliased 13.0.x-dev on
    # Packagist; the alias below lets it stand in for a 13.x release, so this
    # job starts testing Laravel 14 the day work on it lands, long before
    # composer.json can allow ^14.0. Unreleased code: it warns, never blocks.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.5
          extensions: json, mbstring, openssl, sqlite, pdo, pdo_sqlite, gd
          tools: composer

      - name: Install Laravel master
        run: |
          composer config minimum-stability dev
          composer config prefer-stable true
          composer require laravel/framework:"dev-master as 13.99" livewire/livewire:"dev-main as 4.99" --no-update --no-interaction
          composer require --dev orchestra/testbench:"12.x-dev" --no-update --no-interaction
          composer update --no-interaction --no-progress --prefer-dist

      - name: Show the versions under test
        run: composer show | grep -E '^(laravel/framework|livewire/livewire|orchestra/testbench) '

      - name: Run tests
        run: vendor/bin/pest

  browser:
    name: browser tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.4
          extensions: json, mbstring, openssl, sqlite, pdo, pdo_sqlite, gd, sockets
          tools: composer

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Get Composer Cache Directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer Dependencies
        uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('composer.json') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install dependencies
        run: |
          composer install --no-interaction --no-progress --prefer-dist
          npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # Sign-in and BREAD flows in a real browser: what the Livewire tests
      # cannot see (JavaScript errors, navigation, the forms as rendered).
      - name: Run browser tests
        run: vendor/bin/pest tests/Browser
